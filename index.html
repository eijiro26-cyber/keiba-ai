<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KEIBA AI</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
 background:#f4f6fa;
 color:#172033
}

header{
 background:#075cff;
 color:white;
 padding:20px;
 font-size:25px;
 font-weight:bold
}

header small{
 font-size:14px;
 font-weight:normal
}

main{
 max-width:700px;
 margin:auto;
 padding:15px
}

.card{
 background:white;
 border-radius:16px;
 padding:18px;
 margin-bottom:15px;
 box-shadow:0 2px 10px #0001
}

input[type=file]{
 width:100%;
 padding:12px 0
}

#preview{
 display:none;
 width:100%;
 max-height:450px;
 object-fit:contain;
 margin-top:15px;
 border-radius:10px
}

#bar{
 height:8px;
 background:#075cff;
 width:0;
 margin-top:12px;
 border-radius:10px
}

#status{
 font-size:14px
}

.horse{
 display:grid;
 grid-template-columns:55px 1fr 80px;
 gap:8px;
 align-items:center;
 background:#f6f8fb;
 padding:12px;
 margin:7px 0;
 border-radius:10px
}

.num{
 font-size:19px;
 font-weight:bold
}

.name{
 font-weight:bold;
 font-size:16px
}

.prob{
 text-align:right;
 font-weight:bold
}

.badge{
 display:inline-block;
 background:#eef2ff;
 border-radius:6px;
 padding:3px 6px;
 margin-top:4px;
 font-size:11px
}

.hidden{
 display:none
}

pre{
 white-space:pre-wrap;
 background:#111827;
 color:white;
 padding:12px;
 border-radius:10px;
 font-size:11px;
 max-height:300px;
 overflow:auto
}
</style>
</head>

<body>

<header>
🏇 KEIBA AI
<br>
<small>出馬表スクショ予想</small>
</header>

<main>

<div class="card">

<h2>📷 出馬表を選択</h2>

<p>
JRAなどの出馬表スクショを選択してください。
</p>

<input
 id="imageInput"
 type="file"
 accept="image/*"
>

<img id="preview">

<div id="bar"></div>

<p id="status"></p>

</div>


<div id="resultCard" class="card hidden">

<h2>🏆 AI予想</h2>

<div id="summary"></div>

<div id="results"></div>

</div>


<div id="ocrCard" class="card hidden">

<h3>🔎 OCR読み取り結果</h3>

<pre id="ocrText"></pre>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>

const input =
document.getElementById("imageInput");

const preview =
document.getElementById("preview");

const bar =
document.getElementById("bar");

const status =
document.getElementById("status");


/* =========================
   画像をOCR用に高解像度化
========================= */

function prepareImage(file){

 return new Promise((resolve,reject)=>{

  const img=new Image();

  const url=URL.createObjectURL(file);

  img.onload=()=>{

   /*
    小さいスクショでも
    OCRしやすいように拡大
   */

   const scale=
   Math.max(
    2,
    Math.min(4,2500/img.width)
   );

   const canvas=
   document.createElement("canvas");

   canvas.width=
   Math.round(img.width*scale);

   canvas.height=
   Math.round(img.height*scale);

   const ctx=
   canvas.getContext("2d");

   ctx.imageSmoothingEnabled=false;

   ctx.drawImage(
    img,
    0,
    0,
    canvas.width,
    canvas.height
   );

   /*
    グレースケール＋
    コントラスト補正
   */

   const data=
   ctx.getImageData(
    0,
    0,
    canvas.width,
    canvas.height
   );

   for(
    let i=0;
    i<data.data.length;
    i+=4
   ){

    const r=data.data[i];
    const g=data.data[i+1];
    const b=data.data[i+2];

    let gray=
    0.299*r+
    0.587*g+
    0.114*b;

    /*
     コントラスト強化
    */

    gray=
    (gray-128)*1.6+128;

    gray=
    Math.max(
     0,
     Math.min(255,gray)
    );

    data.data[i]=gray;
    data.data[i+1]=gray;
    data.data[i+2]=gray;

   }

   ctx.putImageData(data,0,0);

   canvas.toBlob(
    blob=>{

     URL.revokeObjectURL(url);

     resolve(blob);

    },
    "image/png"
   );

  };

  img.onerror=reject;

  img.src=url;

 });

}


/* =========================
   スクショ選択
========================= */

input.addEventListener(
"change",
async()=>{

 const file=input.files[0];

 if(!file)return;

 preview.src=
 URL.createObjectURL(file);

 preview.style.display="block";

 status.textContent=
 "画像を高解像度化しています…";

 bar.style.width="10%";


 try{

  const prepared=
  await prepareImage(file);

  bar.style.width="25%";

  status.textContent=
  "出馬表を解析しています…";


  /*
   OCR実行
  */

  const result=
  await Tesseract.recognize(
   prepared,
   "jpn+eng",
   {

    logger:m=>{

     if(
      m.status===
      "recognizing text"
     ){

      const p=
      25+
      Math.round(
       m.progress*70
      );

      bar.style.width=
      p+"%";

      status.textContent=
      "文字を読み取り中… "+
      p+"%";

     }

    }

   }
  );


  const text=
  result.data.text;


  document
  .getElementById("ocrText")
  .textContent=text;

  document
  .getElementById("ocrCard")
  .classList.remove("hidden");


  bar.style.width="100%";

  status.textContent=
  "読み取り完了。AI予想を計算しています…";


  makePrediction(text);


 }catch(e){

  console.error(e);

  status.textContent=
  "読み取りに失敗しました。もう一度試してください。";

 }

});


/* =========================
   OCR結果から馬を抽出
========================= */

function makePrediction(text){

 let lines=
 text
 .split(/\r?\n/)
 .map(x=>x.trim())
 .filter(Boolean);


 let horses=[];


 for(
  const line of lines
 ){

  /*
   例

   1 ボーンディスウェイ 57.0

   のような行を探す
  */

  let m=
  line.match(
   /^(\d{1,2})\s+(.+?)\s+(\d{2,3}(?:\.\d+)?)$/
  );


  if(!m){

   m=
   line.match(
    /^(\d{1,2})\s+(.+)$/
   );

  }


  if(!m)continue;


  const number=
  parseInt(m[1]);


  if(
   number<1||
   number>18
  )continue;


  let name=
  m[2]
  .replace(
   /\s+\d+(?:\.\d+)?$/,
   ""
  )
  .trim();


  /*
   馬名として不自然な行を除外
  */

  if(
   name.length<2||
   name.length>30
  )continue;


  if(
   /出馬表|馬名|騎手|斤量|人気|オッズ|馬体重|競馬/.test(name)
  )continue;


  if(
   horses.some(
    h=>h.number===number
   )
  )continue;


  horses.push({

   number:number,

   name:name,

   odds:null

  });

 }


 /*
  馬番が取れない場合の
  予備処理
 */

 if(horses.length<2){

  for(
   const line of lines
  ){

   if(
    /[一-龠ぁ-んァ-ヶ]{3,}/
    .test(line)
    &&
    line.length<25
    &&
    !/競馬|出馬表|騎手|斤量|馬体重|オッズ|人気/
    .test(line)
   ){

    horses.push({

     number:
     horses.length+1,

     name:line,

     odds:null

    });

   }


   if(
    horses.length>=18
   )break;

  }

 }


 if(horses.length<2){

  document
  .getElementById("resultCard")
  .classList.remove("hidden");


  document
  .getElementById("results")
  .innerHTML=
  `
  <p>
  ⚠️ 馬名を十分に読み取れませんでした。
  </p>

  <p>
  出馬表全体が写ったスクショを選択してください。
  </p>
  `;

  return;

 }


 runSimulation(horses);

}


/* =========================
   AIシミュレーション
========================= */

function runSimulation(horses){

 horses.forEach(
 (h,i)=>{

  let score=50;

  /*
   馬番による微調整
  */

  score+=
  ((i*17)%11)-5;

  h.score=score;

 }
 );


 /*
  100万回
 */

 const COUNT=1000000;

 const wins=
 new Array(
  horses.length
 ).fill(0);


 for(
  let race=0;
  race<COUNT;
  race++
 ){

  let best=
  -Infinity;

  let winner=0;


  for(
   let i=0;
   i<horses.length;
   i++
  ){

   const value=
   horses[i].score*
   (
    0.7+
    Math.random()*0.6
   );


   if(value>best){

    best=value;

    winner=i;

   }

  }


  wins[winner]++;

 }


 horses.forEach(
 (h,i)=>{

  h.prob=
  wins[i]/COUNT*100;

 }
 );


 horses.sort(
 (a,b)=>
 b.prob-a.prob
 );


 displayResults(horses);

}


/* =========================
   結果表示
========================= */

function displayResults(horses){

 document
 .getElementById("resultCard")
 .classList
 .remove("hidden");


 const marks=
 [
  "◎",
  "○",
  "▲",
  "△",
  "△",
  "☆"
 ];


 document
 .getElementById("summary")
 .innerHTML=
 `
 <p>
 <b>🎲 100万回シミュレーション完了</b>
 </p>

 <p>
 ◎本命　○対抗　▲単穴　△連下　☆穴
 </p>
 `;


 document
 .getElementById("results")
 .innerHTML=
 horses.map(
 (h,i)=>`

 <div class="horse">

  <div class="num">
   ${marks[i]||"△"}
   ${h.number}
  </div>

  <div>

   <div class="name">
    ${h.name}
   </div>

   <span class="badge">
    AI指数 ${h.score.toFixed(1)}
   </span>

  </div>

  <div class="prob">
   ${h.prob.toFixed(2)}%
  </div>

 </div>

 `
 ).join("");

 status.textContent=
 "予想完了！";

}

</script>

</body>
</html>
