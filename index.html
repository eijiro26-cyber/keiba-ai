<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>

const $=id=>document.getElementById(id);

let horses=[];
window.lastResult=[];


/* =========================
   騎手名
========================= */

const JOCKEY_NAMES=[
'川田将雅','C.ルメール','C ルメール','ルメール',
'戸崎圭太','松山弘平','坂井瑠星','横山武史','横山和生',
'岩田望来','北村友一','西村淳也','団野大成','鮫島克駿',
'菅原明良','丹内祐次','三浦皇成','田辺裕信','津村明秀',
'丸山元気','中井裕二','泉谷楓真','藤岡佑介','武豊',
'幸英明','池添謙一','藤懸貴志','小沢大仁','吉村誠之助',
'高杉吏麒','佐々木大輔','石川裕紀人','原優介','大野拓弥',
'菱田裕二','国分恭介','国分優作','永島まなみ','小林美駒',
'今村聖奈','田口貫太','西塚洸二','富田暁','角田大和',
'酒井学','太宰啓介','和田竜二','和田翼','古川吉洋',
'古川奈穂','松若風馬','荻野極','荻野琢真','長岡禎仁',
'秋山稔樹','黛弘人','水口優也','川須栄彦','小崎綾也',
'森裕太朗','岩田康誠','浜中俊','鮫島良太'
];


/* =========================
   基本関数
========================= */

function esc(s){
return String(s??'').replace(/[&<>"']/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m]))
}


function num(v){

const n=parseFloat(
String(v??'').replace(/[^\d.-]/g,'')
);

return Number.isFinite(n)?n:0;

}


function arr(s){

return String(s||'')
.split(/[,、\s]+/)
.map(num)
.filter(x=>x>0);

}


function makeHorse(n){

return{
num:n,
name:'',
jockey:'',
weight:'',
body:'',
fin:'',
three:'',
style:'',
dist:'',
course:'',
going:'',
jw:'',
jp:'',
jform:'0'
};

}


/* =========================
   表示
========================= */

function render(){

const tb=$('rows');

tb.innerHTML='';

horses.sort((a,b)=>a.num-b.num);

for(const h of horses){

const tr=document.createElement('tr');

tr.innerHTML=`

<td class="num">${h.num}</td>

<td>
<input data-k="name"
value="${esc(h.name)}"
placeholder="馬名">
</td>

<td>
<input data-k="jockey"
value="${esc(h.jockey)}"
placeholder="騎手">
</td>

<td>
<input data-k="weight"
value="${esc(h.weight)}"
placeholder="57">
</td>

<td>
<input data-k="body"
value="${esc(h.body)}"
placeholder="480">
</td>

<td>
<input data-k="fin"
value="${esc(h.fin)}"
placeholder="1,3,2">
</td>

<td>
<input data-k="three"
value="${esc(h.three)}"
placeholder="34.1,34.8">
</td>

<td>

<select data-k="style">

<option value="">中立</option>
<option ${h.style==='逃げ'?'selected':''}>逃げ</option>
<option ${h.style==='先行'?'selected':''}>先行</option>
<option ${h.style==='差し'?'selected':''}>差し</option>
<option ${h.style==='追込'?'selected':''}>追込</option>

</select>

</td>

<td>
<input data-k="dist"
value="${esc(h.dist)}"
placeholder="0〜100">
</td>

<td>
<input data-k="course"
value="${esc(h.course)}"
placeholder="0〜100">
</td>

<td>
<input data-k="going"
value="${esc(h.going)}"
placeholder="0〜100">
</td>

<td>
<input data-k="jw"
value="${esc(h.jw)}"
placeholder="20">
</td>

<td>
<input data-k="jp"
value="${esc(h.jp)}"
placeholder="45">
</td>

<td>
<input data-k="jform"
value="${esc(h.jform)}"
placeholder="-2〜+2">
</td>

`;

tr.querySelectorAll('[data-k]').forEach(inp=>{

inp.addEventListener('input',()=>{
h[inp.dataset.k]=inp.value;
});

inp.addEventListener('change',()=>{
h[inp.dataset.k]=inp.value;
});

});

tb.appendChild(tr);

}

checkCount();

$('dataCard').classList.remove('hidden');

}


/* =========================
   頭数確認
========================= */

function checkCount(){

const ns=horses
.map(h=>h.num)
.filter(n=>n>=1&&n<=18)
.sort((a,b)=>a-b);

const uniq=[...new Set(ns)];

if(!uniq.length){

$('countCheck').innerHTML=
'<span class="warn">馬を認識できませんでした。</span>';

return;
}

const missing=[];

for(let i=1;i<=Math.max(...uniq);i++){

if(!uniq.includes(i)){
missing.push(i);
}

}

const bad=uniq.length!==horses.length;

$('countCheck').innerHTML=`

<span class="${bad?'danger':'ok'}">
${uniq.length}頭を検出
</span>

${missing.length
?'　不足番号：'+missing.join(',')
:'　1〜'+uniq.length+'番を確認'}

${bad?'　重複番号あり':''}

`;

}


/* =========================
   日本語正規化
========================= */

function cleanName(s){

return String(s||'')
.replace(/[\u0000-\u001f]/g,' ')
.replace(/[|｜]/g,' ')
.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g,' ')
.replace(/\s+/g,' ')
.trim();

}


function normalizeJP(s){

return cleanName(s)
.replace(/[ 　]/g,'')
.replace(/[「」『』（）()\[\]【】]/g,'')
.replace(/[‐-–—-]/g,'ー');

}


/* =========================
   馬名判定

   ここでは厳しすぎる判定をしない。
   「ムソウ」「パクト」のように
   短く切れたOCRを確定しない。
========================= */

function validName(s){

const n=normalizeJP(s);

if(n.length<4)return false;

if(n.length>20)return false;

if(!/[ぁ-んァ-ヶ一-龥]/.test(n))
return false;

if(JOCKEY_NAMES.some(j=>{
const jj=normalizeJP(j);
return n===jj;
}))
return false;

const badWords=[
'馬名','性齢','斤量','馬体重',
'単勝','オッズ','人気','前走',
'次走','騎手','調教師','父',
'母','生産者','馬主',
'中京','阪神','京都','東京',
'中山','福島','小倉','札幌',
'函館','新潟'
];

if(badWords.includes(n))
return false;

return true;

}


/* =========================
   OCR候補抽出
========================= */

function extractJapaneseCandidates(text){

const s=cleanName(text);

const raw=s.match(
/[ぁ-んァ-ヶ一-龥ー]{2,20}/g
)||[];

const out=[];

for(const token of raw){

const t=token.trim();

if(!t)continue;

if(JOCKEY_NAMES.some(j=>{
return normalizeJP(j)===normalizeJP(t);
}))
continue;

if(
/^(馬名|性齢|斤量|馬体重|単勝|オッズ|人気|前走|次走|騎手|調教師|父|母|馬主|生産者)$/
.test(t)
)
continue;

out.push(t);

}

return [...new Set(out)];

}


/* =========================
   青色判定
========================= */

function bluePixel(r,g,b){

return(
b>80 &&
b>r*1.12 &&
b>g*1.01 &&
r<210 &&
g<220
);

}


/* =========================
   青文字の横帯検出
========================= */

function detectBlueBands(canvas){

const ctx=canvas.getContext(
'2d',
{willReadFrequently:true}
);

const W=canvas.width;
const H=canvas.height;


/*
JRAスマホ出馬表の左側。
馬名は画面左寄りにある。
*/

const x0=Math.floor(W*.015);
const x1=Math.floor(W*.48);

const y0=Math.floor(H*.07);
const y1=Math.floor(H*.82);

const rw=x1-x0;
const rh=y1-y0;

const data=ctx.getImageData(
x0,
y0,
rw,
rh
).data;

const ys=[];

for(let yy=0;yy<rh;yy++){

let count=0;
let lo=Infinity;
let hi=-1;

for(let x=0;x<rw;x++){

const p=(yy*rw+x)*4;

const r=data[p];
const g=data[p+1];
const b=data[p+2];

if(bluePixel(r,g,b)){

count++;

lo=Math.min(lo,x);
hi=Math.max(hi,x);

}

}

if(count>=4){

ys.push({
y:yy+y0,
count,
span:hi-lo+1,
xmin:lo+x0,
xmax:hi+x0
});

}

}


/*
隣接する青ピクセルを1つの帯にする。
*/

const bands=[];

for(const q of ys){

const last=bands[bands.length-1];

if(!last || q.y-last.end>5){

bands.push({
start:q.y,
end:q.y,
maxCount:q.count,
maxSpan:q.span,
xmin:q.xmin,
xmax:q.xmax,
peak:q.y
});

}else{

last.end=q.y;

if(q.count>last.maxCount){

last.maxCount=q.count;
last.maxSpan=q.span;
last.xmin=q.xmin;
last.xmax=q.xmax;
last.peak=q.y;

}

}

}


/*
馬名は騎手名より横幅が長い。
ただし短い馬名もあるため、
幅だけでなく位置も使う。
*/

return bands
.filter(b=>b.maxSpan>=25)
.map(b=>({
start:b.start,
end:b.end,
peak:b.peak,
xmin:b.xmin,
xmax:b.xmax,
span:b.maxSpan,
center:(b.start+b.end)/2
}));

}


/* =========================
   馬名行を決定
========================= */

function horseRows(canvas){

const bands=detectBlueBands(canvas);

if(!bands.length)
return[];


/*
JRAでは

馬名
騎手

の順で表示される。

したがって、近い2本の青帯では
横幅が大きい方を馬名として扱う。
*/

const candidates=[];

for(let i=0;i<bands.length;i++){

const b=bands[i];

const prev=bands[i-1];
const next=bands[i+1];

let horse=false;


/* 基本条件 */

if(b.span>=55)
horse=true;


/* 前の帯が騎手なら馬名側 */

if(
prev &&
b.center-prev.center<115 &&
b.span>=prev.span*1.10
){

horse=true;

}


/* 次の帯が騎手なら馬名側 */

if(
next &&
next.center-b.center<115 &&
b.span>=next.span*1.10
){

horse=true;

}


if(horse){

candidates.push(b);

}

}


/*
同じ行を二重検出しない。
*/

const out=[];

for(const b of candidates){

const last=out[out.length-1];

if(
last &&
Math.abs(b.center-last.center)<90
){

if(b.span>last.span){

out[out.length-1]=b;

}

}else{

out.push(b);

}

}


/*
18頭まで。
*/

return out
.filter(b=>
b.center>canvas.height*.08 &&
b.center<canvas.height*.82
)
.slice(0,18)
.map(b=>({

y:b.peak,

x0:Math.max(0,b.xmin-8),

x1:Math.min(canvas.width,b.xmax+18),

start:b.start,

end:b.end,

span:b.span

}));

}


/* =========================
   Canvas切り出し
========================= */

function crop(canvas,x0,y0,x1,y1,scale=4){

x0=Math.max(0,Math.floor(x0));
y0=Math.max(0,Math.floor(y0));
x1=Math.min(canvas.width,Math.ceil(x1));
y1=Math.min(canvas.height,Math.ceil(y1));

const w=Math.max(1,x1-x0);
const h=Math.max(1,y1-y0);

const c=document.createElement('canvas');

c.width=w*scale;
c.height=h*scale;

const ctx=c.getContext('2d');

ctx.imageSmoothingEnabled=true;

ctx.drawImage(
canvas,
x0,y0,w,h,
0,0,c.width,c.height
);

return c;

}


/* =========================
   青文字だけを抽出
========================= */

function blueMaskCrop(canvas,band){

const padX=18;
const padY=12;

const x0=Math.max(
0,
band.x0-padX
);

const x1=Math.min(
canvas.width,
band.x1+padX
);

const y0=Math.max(
0,
band.start-padY
);

const y1=Math.min(
canvas.height,
band.end+padY
);

const w=x1-x0;
const h=y1-y0;

const src=canvas
.getContext('2d',{willReadFrequently:true})
.getImageData(x0,y0,w,h);

const tmp=document.createElement('canvas');

tmp.width=w;
tmp.height=h;

const out=new Uint8ClampedArray(
src.data.length
);

for(let i=0;i<src.data.length;i+=4){

const r=src.data[i];
const g=src.data[i+1];
const b=src.data[i+2];

if(bluePixel(r,g,b)){

out[i]=0;
out[i+1]=0;
out[i+2]=0;

}else{

out[i]=255;
out[i+1]=255;
out[i+2]=255;

}

out[i+3]=255;

}

tmp.getContext('2d').putImageData(
new ImageData(out,w,h),
0,0
);

return crop(
tmp,
0,
0,
w,
h,
5
);

}


/* =========================
   Tesseract
========================= */

async function ocrCanvas(c,psm){

const result=
await Tesseract.recognize(
c,
'jpn+eng',
{
psm:psm,
preserve_interword_spaces:true
}
);

return result.data.text||'';

}


/* =========================
   馬名OCR

   ★今回の核心部分

   青文字だけ
   ↓
   複数PSM
   ↓
   候補を集計
========================= */

async function ocrName(canvas,band){

const candidates=[];


/*
① 青文字だけ
*/

const masked=
blueMaskCrop(canvas,band);

for(const psm of [7,13,8,6]){

try{

const raw=
await ocrCanvas(masked,psm);

const toks=
extractJapaneseCandidates(raw);

for(const t of toks){

if(t.length>=4){

candidates.push({
name:t,
psm,
raw,
type:'blue'
});

}

}

}catch(e){}

}


/*
② 元画像の馬名部分を直接OCR

青色マスクだけで失敗した場合の強力な予備。
*/

const wide=
crop(
canvas,
Math.max(0,band.x0-25),
Math.max(0,band.start-10),
Math.min(canvas.width,band.x1+35),
Math.min(canvas.height,band.end+10),
5
);

for(const psm of [7,13,8]){

try{

const raw=
await ocrCanvas(wide,psm);

const toks=
extractJapaneseCandidates(raw);

for(const t of toks){

if(t.length>=4){

candidates.push({
name:t,
psm,
raw,
type:'direct'
});

}

}

}catch(e){}

}


/*
③ 후보評価

長すぎる文章ではなく、
同じ文字列が複数回出たものを優先。
*/

const score={};

for(const c of candidates){

const key=normalizeJP(c.name);

if(!key)continue;

if(!score[key]){

score[key]={
name:c.name,
count:0,
length:key.length,
blue:0,
direct:0
};

}

score[key].count++;

if(c.type==='blue')
score[key].blue++;

if(c.type==='direct')
score[key].direct++;

}


const list=Object.values(score);


/*
4文字以上を優先。
ただし「ピコキング」のような
実際の馬名を短く切ったものより
長い候補を優先する。
*/

list.sort((a,b)=>{

const aa=
a.count*100+
a.blue*30+
a.direct*10+
Math.min(a.length,14);

const bb=
b.count*100+
b.blue*30+
b.direct*10+
Math.min(b.length,14);

return bb-aa;

});


if(list.length){

return{

name:list[0].name,

text:candidates
.map(c=>
`${c.type}/PSM${c.psm}: ${c.raw.replace(/\n/g,' ')}`
)
.join(' | ')

};

}


/*
④ 完全失敗
*/

return{

name:'',

text:'馬名OCR候補なし'

};

}


/* =========================
   行OCR
========================= */

async function ocrRegion(
canvas,
x,
y,
w,
h,
psm=6
){

const c=crop(
canvas,
x,
y,
x+w,
y+h,
3
);

return ocrCanvas(c,psm);

}


/* =========================
   騎手・斤量・馬体重・3F
========================= */

function parseFields(text){

const t=
String(text||'')
.replace(/\n+/g,' ')
.replace(/\s+/g,' ')
.trim();


let jockey='';

for(const j of JOCKEY_NAMES){

if(t.includes(j)){

jockey=j;
break;

}

}


const kgMatch=
t.match(
/(?:^|\s)(5[0-9]|6[0-1])(?:\.0)?\s*kg/
);

const weight=
kgMatch?kgMatch[1]:'';


const bodyMatch=
t.match(
/(?:^|\s)([3-5][0-9]{2})\s*kg/
);

const body=
bodyMatch?bodyMatch[1]:'';


const three=[
...t.matchAll(
/(?:3F|３F)\s*([0-9]{2}\.\d)/g
)
]
.map(m=>m[1])
.join(',');


return{
jockey,
weight,
body,
three
};

}


/* =========================
   OCRメイン
========================= */

async function ocr(){

const file=$('file').files[0];

if(!file){

$('status').textContent=
'先にJRA出馬表の画像を選択してください。';

return;

}


$('ocrBtn').disabled=true;

$('bar').style.width='2%';

$('status').textContent=
'画像を解析しています…';


try{

const img=
await new Promise((resolve,reject)=>{

const i=new Image();

i.onload=()=>resolve(i);

i.onerror=reject;

i.src=
URL.createObjectURL(file);

});


const canvas=
document.createElement('canvas');

canvas.width=
img.naturalWidth||img.width;

canvas.height=
img.naturalHeight||img.height;

canvas.getContext('2d').drawImage(
img,
0,
0,
canvas.width,
canvas.height
);


$('status').textContent=
'馬名の青文字を検出しています…';


const rows=
horseRows(canvas);


if(rows.length<2){

throw new Error(
'馬名行を検出できませんでした'
);

}


horses=[];

const logs=[];


for(let i=0;i<rows.length;i++){

const band=rows[i];


/*
行の上下範囲
*/

const prev=
i>0
?rows[i-1].y
:band.y-150;

const next=
i<rows.length-1
?rows[i+1].y
:band.y+150;


const top=
Math.max(
0,
Math.round((prev+band.y)/2)
);

const bottom=
Math.min(
canvas.height,
Math.round((band.y+next)/2)
);


/*
行全体OCRは補助情報として使用。
馬名確定には直接馬名OCRを優先。
*/

const rowText=
await ocrRegion(
canvas,
canvas.width*.01,
top,
canvas.width*.68,
bottom-top,
6
);


/*
★馬名を直接OCR
*/

const nm=
await ocrName(
canvas,
band
);


const fields=
parseFields(rowText);


const h=
makeHorse(i+1);

h.name=
nm.name;

h.jockey=
fields.jockey;

h.weight=
fields.weight;

h.body=
fields.body;

h.three=
fields.three;


horses.push(h);


logs.push(
[
`===== ${i+1}番 =====`,
`検出位置 Y: ${band.y}`,
`青文字幅: ${band.span}px`,
`抽出馬名: ${nm.name||'【取得失敗】'}`,
`馬名OCR: ${nm.text||''}`,
`騎手: ${fields.jockey||'未取得'}`,
`斤量: ${fields.weight||'未取得'}`,
`馬体重: ${fields.body||'未取得'}`,
`3F: ${fields.three||'未取得'}`,
`行OCR: ${rowText||''}`
].join('\n')
);


$('bar').style.width=
(
5+
(i+1)/rows.length*92
)+'%';

$('status').textContent=
`OCR中… ${i+1}/${rows.length}頭`;

}


$('raw').textContent=
logs.join('\n\n');

$('rawCard').classList.remove('hidden');


render();


const blank=
horses.filter(h=>!h.name).length;


if(blank){

$('status').innerHTML=
`OCR完了：${horses.length}頭。<br>
<span class="warn">${blank}頭の馬名を取得できませんでした。</span>`;

}else{

$('status').innerHTML=
`<span class="ok">
OCR完了：${horses.length}頭すべての馬名を取得しました。
</span>`;

}


$('bar').style.width='100%';

checkCount();


}catch(e){

console.error(e);

$('status').innerHTML=
`<span class="danger">
OCRに失敗しました。
</span><br>
JRA出馬表全体が写った画像を使用してください。`;


}finally{

$('ocrBtn').disabled=false;

}

}


/* =========================
   脚質ボーナス
========================= */

function styleBonus(style,surface,distance){

if(!style)return 0;

const d=num(distance);

if(surface==='芝'&&d<=1400){

return style==='逃げ'?2.5:
style==='先行'?2:
style==='差し'?1:0;

}

if(surface==='芝'&&d>=1800){

return style==='差し'?2.5:
style==='追込'?1.8:
style==='先行'?1.5:0;

}

if(surface==='ダート'&&d<=1400){

return style==='逃げ'?2.5:
style==='先行'?2:
style==='差し'?1:0;

}

return style==='先行'?1.2:
style==='差し'?1.2:0;

}


/* =========================
   馬の指数
========================= */

function scoreHorse(h){

const fin=arr(h.fin);

const three=arr(h.three);

let s=50;


/*
過去着順
*/

if(fin.length){

const avg=
fin.reduce((a,b)=>a+b,0)/
fin.length;

s+=Math.max(
-12,
14-avg*2.2
);

s+=
fin.filter(x=>x<=3).length*
2.2;

}


/*
3F
*/

if(three.length){

const avg=
three.reduce((a,b)=>a+b,0)/
three.length;

s+=Math.max(
-8,
Math.min(
8,
(36-avg)*2.2
)
);

}


/*
適性
*/

s+=(num(h.dist)-50)*.10;

s+=(num(h.course)-50)*.08;

s+=(num(h.going)-50)*.08;


/*
騎手
*/

s+=num(h.jw)*.10;

s+=num(h.jp)*.06;

s+=num(h.jform)*1.5;


/*
脚質
*/

s+=styleBonus(
h.style,
$('surface').value,
$('distance').value
);


/*
馬体重
*/

const bw=num(h.body);

if(bw){

s-=Math.abs(
bw-480
)*.015;

}


/*
斤量
*/

const kg=num(h.weight);

if(kg){

s-=Math.abs(
kg-56
)*.08;

}


return s;

}


/* =========================
   正規分布乱数
========================= */

function randn(){

let u=0;
let v=0;

while(!u)u=Math.random();

while(!v)v=Math.random();

return Math.sqrt(
-2*Math.log(u)
)*
Math.cos(
2*Math.PI*v
);

}


/* =========================
   10,000回シミュレーション
========================= */

function simulate(){

if(horses.length<2){

alert(
'先にスクショを読み取ってください。'
);

return;

}


const nums=
horses.map(h=>h.num);

const uniq=
[...new Set(nums)];


/*
馬名未取得をチェック
*/

const badName=
horses.some(
h=>!h.name||normalizeJP(h.name).length<4
);


if(
uniq.length!==horses.length||
badName
){

alert(
'馬番または馬名が未確認です。読み取りデータを確認してください。'
);

return;

}


const n=10000;


const S=
horses.map(h=>({

h,
score:scoreHorse(h),
win:0,
top:0

}));


for(let r=0;r<n;r++){

const a=
S.map((x,i)=>({

i,

s:
x.score+
randn()*7

}))
.sort(
(a,b)=>b.s-a.s
);


a.forEach((x,k)=>{

if(k===0)
S[x.i].win++;

if(k<3)
S[x.i].top++;

});

}


S.forEach(x=>{

x.wp=x.win/n*100;

x.tp=x.top/n*100;

});


S.sort(
(a,b)=>b.wp-a.wp
);


window.lastResult=S;


$('summary').innerHTML=`

<span class="pill">
${esc($('course').value||'競馬場未選択')}
</span>

<span class="pill">
${esc($('surface').value)}
</span>

<span class="pill">
${esc($('distance').value||'?')}m
</span>

<span class="pill">
${esc($('track').value)}
</span>

<p class="big">
◎ ${esc(
S[0].h.num+'番 '+S[0].h.name
)}
</p>

<div>
勝率 ${S[0].wp.toFixed(1)}%
　
3着内 ${S[0].tp.toFixed(1)}%
</div>

<div class="note">
オッズは計算に一切使用していません。<br>
10,000回モンテカルロシミュレーション。
</div>

`;


$('results').innerHTML=
S.map((x,i)=>`

<div class="result">

<span class="rank">
${['◎','○','▲','△','☆'][i]||'△'}
</span>

<b>
${x.h.num}番 ${esc(x.h.name)}
</b>

<br>

<span class="small">
モデル指数 ${x.score.toFixed(1)}
　
勝率 ${x.wp.toFixed(1)}%
　
3着内 ${x.tp.toFixed(1)}%
</span>

</div>

`).join('');


$('resultCard').classList.remove(
'hidden'
);


window.scrollTo({
top:$('resultCard').offsetTop-10,
behavior:'smooth'
});

}


/* =========================
   馬を追加
========================= */

$('addBtn').onclick=()=>{

const used=
new Set(horses.map(h=>h.num));

let n=1;

while(used.has(n)&&n<=18)
n++;

if(n<=18){

horses.push(
makeHorse(n)
);

render();

}

};

);
