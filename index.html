<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16821a"><title>KEIBA AI</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body><header>🏇 <b>KEIBA AI</b><small>出馬表スクショ → 自動読み取り → 予想</small></header><main><section><h2>① レース条件</h2><div class="grid"><label>競馬場<select id="course"><option>新潟</option><option>中京</option><option>東京</option><option>中山</option><option>阪神</option><option>京都</option></select></label><label>距離<input id="distance" type="number" value="2000"></label><label>馬場<select id="track"><option>良</option><option>稍重</option><option>重</option><option>不良</option></select></label><label>回数<select id="runs"><option value="100000">10万回</option><option value="500000">50万回</option><option value="1000000" selected>100万回</option></select></label></div></section><section><h2>② 出馬表のスクショ</h2><p>JRAの出馬表をスクショして、下の枠をタップして画像を選択。</p><input id="file" type="file" accept="image/*" hidden><div id="drop" class="drop">📷<br><b>出馬表の画像を選択</b><small>写真・スクショから選択</small></div><img id="preview" hidden><button id="read">画像を読み取る</button><button id="clear">クリア</button><div id="msg"></div></section><section id="edit" hidden><h2>③ 読み取り結果</h2><textarea id="text"></textarea><button id="predict">このデータで予想する</button></section><section id="result" hidden><h2>④ AI予想</h2><div id="summary"></div><div class="table"><table><thead><tr><th>印</th><th>馬</th><th>指数</th><th>勝率</th><th>3着内</th></tr></thead><tbody id="tbody"></tbody></table></div></section></main><footer>KEIBA AI prototype</footer><script src="app.js"></script></body></html>
