<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16821a"><title>KEIBA AI</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body><header><b>🏇 KEIBA AI</b><small>JRA出馬表コピペ → 自動分析</small></header><main>
<section><h2>① レース条件</h2><div class="grid"><label>競馬場<select id="course"><option>新潟</option><option>中京</option><option>東京</option><option>中山</option><option>阪神</option><option>京都</option><option>小倉</option><option>福島</option><option>札幌</option><option>函館</option></select></label><label>距離<input id="distance" type="number" value="2000"></label><label>馬場<select id="track"><option>良</option><option selected>稍重</option><option>重</option><option>不良</option></select></label><label>回数<select id="runs"><option value="100000">10万回</option><option value="500000">50万回</option><option value="1000000" selected>100万回</option></select></label></div></section>
<section><h2>② JRA出馬表を貼り付け</h2><p>JRA公式の出馬表をコピーして、そのまま貼り付けてください。</p><textarea id="input" placeholder="例：1　馬名 57.0 (5番人気)&#10;牡5 / 鹿&#10;(5,2,1,8)&#10;騎手名(57.0) 調教師名"></textarea><div class="buttons"><button id="sample">サンプル</button><button id="clear">クリア</button><button class="go" id="predict">予想する</button></div></section>
<section id="progress" hidden><h2>③ シミュレーション</h2><div class="bar"><i id="bar"></i></div><p id="status"></p></section>
<section id="result" hidden><h2>④ 結果</h2><div id="summary"></div><div class="table"><table><thead><tr><th>印</th><th>馬</th><th>指数</th><th>勝率</th><th>3着内</th></tr></thead><tbody id="tbody"></tbody></table></div><p class="note">オッズは能力シミュレーションに使用していません。貼り付けデータだけで動く試作版です。</p></section></main><footer>KEIBA AI prototype</footer><script src="app.js"></script></body></html>
