/* =========================
   共通
========================= */

function esc(s){

return String(s ?? "")
.replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m]));

}


function number(v){

const n=parseFloat(
String(v ?? "")
.replace(/[^\d.-]/g,"")
);

return Number.isFinite(n) ? n : 0;

}


function numbers(v){

return String(v || "")
.split(/[,\s、]+/)
.map(number)
.filter(x=>x>0);

}


function japaneseCount(s){

return (
String(s || "")
.match(/[ぁ-んァ-ヶ一-龥]/g) || []
).length;

}

/* =========================

========================= */

function checkCount(){

/* =========================
   画像読み込み
========================= */

reader.onload=()=>{

/* =========================
   青色判定
========================= */

function isBlue(r,g,b){

return (

b>100 &&
b>r*1.15 &&
b>g*1.02 &&
r<180

);

}


/* =========================
   青文字だけ抽出
========================= */

function blueOnlyCanvas(src,x,y,w,h){

const c=document.createElement("canvas");

c.width=Math.max(1,Math.round(w));

c.height=Math.max(1,Math.round(h));

const ctx=c.getContext("2d",{willReadFrequently:true});

ctx.drawImage(
src,
Math.round(x),
Math.round(y),
Math.round(w),
Math.round(h),
0,
0,
c.width,
c.height
);

const d=ctx.getImageData(
0,
0,
c.width,
c.height
);

for(let i=0;i<d.data.length;i+=4){

const r=d.data[i];

const g=d.data[i+1];

const b=d.data[i+2];

if(isBlue(r,g,b)){

d.data[i]=0;
d.data[i+1]=0;
d.data[i+2]=0;

}else{

d.data[i]=255;
d.data[i+1]=255;
d.data[i+2]=255;

}

}

ctx.putImageData(d,0,0);

return c;

}


/* =========================
   全体OCR
========================= */

async function fullOCR(canvas){

const r=await Tesseract.recognize(

canvas,

"jpn+eng",

{

logger:m=>{

if(m.status==="recognizing text"){

const p=Math.round(m.progress*50);

$("bar").style.width=p+"%";

$("status").textContent=
"出馬表を解析中… "+p+"%";

}

}

}

);

return r.data;

}


/* =========================
   OCRライン候補
========================= */

function candidateLines(data,canvas){

const words=(data.words||[])

.filter(w=>{

const text=String(w.text||"").trim();

if(!text)return false;

const jp=japaneseCount(text);

if(jp<2)return false;

const x=w.bbox.x0;

const y=w.bbox.y0;

const width=w.bbox.x1-w.bbox.x0;

const height=w.bbox.y1-w.bbox.y0;

if(x>canvas.width*.55)return false;

if(y<canvas.height*.15)return false;

if(y>canvas.height*.80)return false;

if(height<12)return false;

if(height>90)return false;

return true;

})

.map(w=>({

x:w.bbox.x0,

y:w.bbox.y0,

x2:w.bbox.x1,

y2:w.bbox.y1,

text:String(w.text).trim(),

conf:Number(w.confidence||w.conf||0)

}));


const lines=[];

for(const w of words.sort((a,b)=>a.y-b.y)){

let line=lines.find(
l=>Math.abs(l.y-w.y)<28
);

if(!line){

line={
y:w.y,
x:w.x,
x2:w.x2,
y2:w.y2,
words:[]
};

lines.push(line);

}else{

line.words.push(w);

line.x=Math.min(line.x,w.x);

line.x2=Math.max(line.x2,w.x2);

line.y2=Math.max(line.y2,w.y2);

}

}

for(const l of lines){

if(!l.words.length)l.words=words.filter(
w=>Math.abs(w.y-l.y)<28
);

l.text=l.words
.sort((a,b)=>a.x-b.x)
.map(w=>w.text)
.join("");

l.jp=japaneseCount(l.text);

l.width=l.x2-l.x;

l.height=l.y2-l.y;

}

return lines

.filter(l=>l.jp>=3)

.sort((a,b)=>a.y-b.y);

}


/* =========================
   青色密度
========================= */

function blueDensity(canvas,x,y,w,h){

const ctx=canvas.getContext(
"2d",
{willReadFrequently:true}
);

x=Math.max(0,Math.floor(x));

y=Math.max(0,Math.floor(y));

w=Math.min(canvas.width-x,Math.floor(w));

h=Math.min(canvas.height-y,Math.floor(h));

if(w<=0||h<=0)return 0;

const d=ctx.getImageData(x,y,w,h).data;

let blue=0;

let total=0;

for(let i=0;i<d.length;i+=4){

const r=d[i];
const g=d[i+1];
const b=d[i+2];

if(r>245&&g>245&&b>245)continue;

total++;

if(isBlue(r,g,b))blue++;

}

return total?blue/total:0;

}


/* =========================
   馬名候補選択
========================= */

function selectHorseLines(lines,canvas){

const candidates=[];

for(const line of lines){

const density=blueDensity(
canvas,
line.x,
line.y,
Math.min(line.width,canvas.width*.45),
line.height+12
);

const score=

density*100+

Math.min(line.jp,12)*2+

Math.min(line.height,50)*.15;

if(density>.015){

candidates.push({
...line,
density,
score
});

}

}


/*
  近い2行に青文字がある場合、
  基本的に上側か文字量の多い側を馬名とする。
*/

const groups=[];

for(const c of candidates){

let g=groups.find(
x=>Math.abs(x.y-c.y)<55
);

if(!g){

groups.push({
y:c.y,
items:[c]
});

}else{

g.items.push(c);

}

}


const selected=[];

for(const g of groups){

g.items.sort((a,b)=>{

if(b.jp!==a.jp)return b.jp-a.jp;

if(b.density!==a.density)
return b.density-a.density;

return b.score-a.score;

});

selected.push(g.items[0]);

}

return selected

.sort((a,b)=>a.y-b.y)

.slice(0,18);

}


/* =========================
   馬名OCR
========================= */

async function horseNameOCR(canvas,line){

const padX=12;

const padY=8;

const x=Math.max(0,line.x-padX);

const y=Math.max(0,line.y-padY);

const w=Math.min(
canvas.width-x,
Math.max(line.width+padX*2,220)
);

const h=Math.min(
canvas.height-y,
Math.max(line.height+padY*2,60)
);

const blue=blueOnlyCanvas(
canvas,
x,
y,
w,
h
);

const r=await Tesseract.recognize(

blue,

"jpn",

{

psm:7,

preserve_interword_spaces:false

}

);

return cleanHorseName(r.data.text||"");

}


/* =========================
   馬名整理
========================= */

function cleanHorseName(s){

return String(s||"")

.replace(/[\u0000-\u001f]/g," ")

.replace(/\s+/g," ")

.replace(/^[^ぁ-んァ-ヶ一-龥A-Za-z0-9]+/,"")

.replace(
/^(馬名|騎手|人気|斤量|馬体重|調教師)\s*/,
""
)

.trim();

}


/* =========================
   行OCR
========================= */

async function rowOCR(canvas,line){

const top=Math.max(
0,
line.y-25
);

const bottom=Math.min(
canvas.height,
line.y+Math.max(70,line.height+45)
);

const x=0;

const width=Math.min(
canvas.width,
canvas.width*.72
);

const c=document.createElement("canvas");

c.width=Math.round(width);

c.height=Math.round(bottom-top);

const ctx=c.getContext("2d");

ctx.drawImage(
canvas,
x,
top,
width,
bottom-top,
0,
0,
c.width,
c.height
);

const r=await Tesseract.recognize(

c,

"jpn+eng",

{

psm:6

}

);

return String(r.data.text||"")
.replace(/\s+/g," ")
.trim();

}


/* =========================
   行情報抽出
========================= */

function parseRow(txt){

const s=String(txt||"")
.replace(/\s+/g," ")
.trim();

let jockey="";

for(const j of JOCKEYS){

if(s.includes(j)){

jockey=j;

break;

}

}


let weight="";

const wm=s.match(
/(?:^|\s)(5[0-9]|60)(?:\.0)?\s*kg/
);

if(wm)weight=wm[1];


let body="";

const bm=s.match(
/(?:^|\s)(3[8-9][0-9]|4[0-9]{2}|5[0-9]{2})(?:\s*kg)?/
);

if(bm)body=bm[1];


const th=[

...s.matchAll(
/(?:3F|３F)\s*([0-9]{2}\.[0-9])/g
)

]

.map(x=>x[1])

.join(",");


return{

jockey,

weight,

body,

three:th

};

}


/* =========================
   OCR本体
========================= */

async function runOCR(){

if(!sourceImage){

$("status").textContent=
"先に画像を選択してください。";

return;

}

$("ocrBtn").disabled=true;

$("bar").style.width="2%";

$("status").textContent=
"出馬表を解析しています…";


try{

const scale=Math.min(
2.2,
2000/sourceImage.width
);

const canvas=document.createElement("canvas");

canvas.width=Math.round(
sourceImage.width*scale
);

canvas.height=Math.round(
sourceImage.height*scale
);

const ctx=canvas.getContext(
"2d",
{willReadFrequently:true}
);

ctx.imageSmoothingEnabled=true;

ctx.drawImage(
sourceImage,
0,
0,
canvas.width,
canvas.height
);


$("bar").style.width="8%";


const data=await fullOCR(canvas);


$("bar").style.width="55%";


const lines=candidateLines(
data,
canvas
);


const selected=selectHorseLines(
lines,
canvas
);


if(selected.length<2){

throw new Error(
"馬名候補が見つかりませんでした"
);

}


horses=[];

const logs=[];


for(let i=0;i<selected.length;i++){

const line=selected[i];

$("status").textContent=
`馬名を確認中… ${i+1}/${selected.length}`;


let name=await horseNameOCR(
canvas,
line
);


/*
 OCRが短すぎる場合は
 元のOCR文字列を第2候補として使用
*/

if(
japaneseCount(name)<2 ||
name.length<2
){

name=cleanHorseName(
line.text
);

}


const rowText=await rowOCR(
canvas,
line
);

const fields=parseRow(rowText);


const h=makeHorse(i+1);

h.name=name;

h.jockey=fields.jockey;

h.weight=fields.weight;

h.body=fields.body;

h.three=fields.three;


horses.push(h);


logs.push(
`【${i+1}番候補】\n`+
`馬名OCR：${name}\n`+
`元OCR：${line.text}\n`+
`青色密度：${(line.density*100).toFixed(1)}%\n`+
`行OCR：${rowText}`
);


$("bar").style.width=
55+(i+1)/selected.length*40
+"%";

}


$("raw").textContent=
logs.join("\n\n");

$("rawCard").classList.remove("hidden");

render();

$("bar").style.width="100%";

$("status").textContent=
`OCR完了：${horses.length}頭。表を確認してください。`;

}
catch(e){

console.error(e);

$("status").textContent=
"馬名の読み取りに失敗しました。JRA出馬表全体が写った画像を使用してください。";

}
finally{

$("ocrBtn").disabled=false;

}

}


$("ocrBtn").addEventListener(
"click",
runOCR
);

/* =========================
   適性評価
========================= */

function symbolScore(v){

switch(v){

case"◎":return 6;

case"○":return 3;

case"△":return -2;

case"×":return -5;

default:return 0;

}

}


/* =========================
   脚質評価
========================= */

function styleScore(style){

const course=$("course").value;

const distance=number(
$("distance").value
);

if(!style)return 0;


/*
 中京1400など短距離は
 先行・逃げを少し評価
*/

if(
course==="中京" &&
distance>=1200 &&
distance<=1600
){

if(style==="先行")return 5;

if(style==="逃げ")return 4;

if(style==="差し")return 2;

if(style==="追込")return -1;

}


/*
 東京・新潟の長めは差しも評価
*/

if(
(course==="東京"||course==="新潟") &&
distance>=1600
){

if(style==="差し")return 5;

if(style==="追込")return 3;

if(style==="先行")return 2;

if(style==="逃げ")return 0;

}

return 2;

}


/* =========================
   過去成績
========================= */

function finishScore(fin){

const a=numbers(fin);

if(!a.length)return 0;

let score=0;

for(let i=0;i<a.length;i++){

const p=a[i];

let s=0;

if(p===1)s=10;
else if(p===2)s=7;
else if(p===3)s=5;
else if(p===4)s=3;
else if(p===5)s=2;
else if(p<=8)s=0;
else s=-2;

score+=s*(1-i*.12);

}

return score/a.length;

}


/* =========================
   3F
========================= */

function threeScore(three){

const a=numbers(three);

if(!a.length)return 0;

const avg=
a.reduce((x,y)=>x+y,0)/a.length;


/*
 3Fが速いほどプラス
*/

if(avg<=33.5)return 9;

if(avg<=34.0)return 7;

if(avg<=34.5)return 5;

if(avg<=35.0)return 3;

if(avg<=35.5)return 1;

if(avg<=36.0)return -1;

return -3;

}


/* =========================
   体重
========================= */

function bodyScore(body){

const b=number(body);

if(!b)return 0;

if(b<430)return -2;

if(b<=520)return 2;

return -1;

}


/* =========================
   騎手
========================= */

function jockeyScore(h){

let s=0;

const win=number(h.jw);

const place=number(h.jp);

if(win){

if(win>=25)s+=6;

else if(win>=18)s+=4;

else if(win>=12)s+=2;

else if(win<5)s-=2;

}

if(place){

if(place>=50)s+=5;

else if(place>=40)s+=3;

else if(place>=30)s+=1;

else if(place<20)s-=2;

}

const form=number(h.jform);

s+=Math.max(-4,Math.min(4,form));

return s;

}


/* =========================
   総合スコア
========================= */

function modelScore(h){

let s=50;


/*
 過去成績
*/

s+=finishScore(h.fin)*2.2;


/*
 3F
*/

s+=threeScore(h.three)*1.5;


/*
 適性
*/

s+=symbolScore(h.distanceFit);

s+=symbolScore(h.courseFit);

s+=symbolScore(h.goingFit);


/*
 脚質
*/

s+=styleScore(h.style);


/*
 馬体重
*/

s+=bodyScore(h.body);


/*
 騎手
*/

s+=jockeyScore(h);


/*
 斤量
*/

const w=number(h.weight);

if(w){

if(w<=55)s+=2;

else if(w>=59)s-=2;

}


/*
 微小な乱数はシミュレーション時のみ入れる。
 馬番には一切補正しない。
*/

return s;

}


/* =========================
   正規乱数
========================= */

function randn(){

let u=0;

let v=0;

while(!u)u=Math.random();

while(!v)v=Math.random();

return Math.sqrt(
-2*Math.log(u)
)*Math.cos(
2*Math.PI*v
);

}


/* =========================
   10,000回シミュレーション
========================= */

function simulate(){

if(horses.length<2){

alert("2頭以上必要です");

return;

}


const distance=number(
$("distance").value
);

if(!$("course").value){

alert("競馬場を選択してください");

return;

}

if(!distance){

alert("距離を入力してください");

return;

}


const sims=10000;


/*
 各馬の基礎スコア
*/

const S=horses.map(h=>({

h,

score:modelScore(h),

wins:0,

top3:0,

sumRank:0

}));


$("status").textContent=
"10,000回シミュレーション中…";


/*
 Monte Carlo
*/

for(let r=0;r<sims;r++){

const order=S

.map((x,i)=>({

i,

score:
x.score+
randn()*7

}))

.sort(
(a,b)=>b.score-a.score
);


for(let k=0;k<order.length;k++){

const x=S[order[k].i];

const rank=k+1;

if(rank===1)x.wins++;

if(rank<=3)x.top3++;

x.sumRank+=rank;

}

}


for(const x of S){

x.win=x.wins/sims*100;

x.top=x.top3/sims*100;

x.avg=x.sumRank/sims;

}


/*
 勝率順
*/

S.sort(
(a,b)=>b.win-a.win
);


/*
 結果表示
*/

const out=$("results");

out.innerHTML="";


S.forEach((x,i)=>{

const marks=[
"◎",
"○",
"▲",
"△",
"☆"
];

const mark=
marks[i]||"";


const div=document.createElement(
"div"
);

div.className="result";

div.innerHTML=`

<div class="rank">
${mark}
</div>

<div>

<div class="big">
${x.h.num}番 ${esc(x.h.name)}
</div>

<div class="small">

勝率 ${x.win.toFixed(1)}%　

3着内 ${x.top.toFixed(1)}%　

平均着順 ${x.avg.toFixed(2)}

</div>

</div>

<div class="pill">
${x.score.toFixed(1)}
</div>

`;

out.appendChild(div);

});


$("resultCard").classList.remove(
"hidden"
);

window.lastResult=S;

$("status").textContent=
"計算完了：10,000回";


window.scrollTo({

top:$("resultCard").offsetTop-10,

behavior:"smooth"

});

}
